name: Build Desktop App

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend API URL (ví dụ: http://10.1.11.100:8000)'
        required: true
        default: 'http://localhost:8000'

jobs:
  build-tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Install frontend deps
        working-directory: desktop
        run: npm install

      - name: Set backend URL
        working-directory: desktop
        shell: bash
        run: echo "VITE_BACKEND_URL=${{ github.event.inputs.backend_url }}" > .env

      - name: Prepare icons (dùng icon default nếu chưa có)
        working-directory: desktop
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          if [ ! -f src-tauri/icons/icon.ico ]; then
            curl -L -o src-tauri/icons/source.png https://raw.githubusercontent.com/tauri-apps/tauri/dev/examples/api/src-tauri/icons/icon.png
            npx -y @tauri-apps/cli@2 icon ./src-tauri/icons/source.png
          fi

      - name: Build Tauri
        working-directory: desktop
        run: npm run tauri:build

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: sop-ai-desktop-msi
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30