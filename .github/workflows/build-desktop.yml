name: Build Desktop App

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend API URL (ví dụ: http://10.1.11.100:8000)'
        required: true
        default: 'http://localhost:8000'

jobs:
  build-tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Install frontend deps
        working-directory: desktop
        run: npm install

      # API_TOKEN: repo secret, phải trùng API_TOKEN của backend (thiếu secret → app không gửi token)
      - name: Set backend URL & API token
        working-directory: desktop
        shell: bash
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          echo "VITE_BACKEND_URL=${{ github.event.inputs.backend_url }}" > .env
          echo "VITE_API_TOKEN=${API_TOKEN}" >> .env

      - name: Generate icons from source.png
        working-directory: desktop
        shell: bash
        run: |
          if [ ! -f src-tauri/icons/source.png ]; then
            echo "::error::Thiếu file src-tauri/icons/source.png"
            exit 1
          fi
          npx -y @tauri-apps/cli@2 icon ./src-tauri/icons/source.png

      - name: Build Tauri
        working-directory: desktop
        run: npm run tauri:build

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: sop-ai-desktop-msi
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30