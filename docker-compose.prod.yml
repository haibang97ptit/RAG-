# Production compose: Qdrant + Backend (từ GHCR)
# Dùng trên Linux server, sau khi đã mount SMB share vào /mnt/sop-data

version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: sop-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__LOG_LEVEL: INFO
    networks:
      - sop-net

  backend:
    # Thay <OWNER>/<REPO> bằng path GitHub thực của em
    # IMAGE_TAG: đặt sha-xxxxxxx trong .env.prod để rollback về bản cũ
    image: ghcr.io/${GITHUB_OWNER:-haibang97ptit}/sop-ai-backend:${IMAGE_TAG:-latest}
    container_name: sop-backend
    restart: unless-stopped
    depends_on:
      - qdrant
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      QDRANT_URL: http://qdrant:6333
      PORT: "8000"
      # Đổi COLLECTION_NAME trong .env.prod để chuyển sang collection mới (xem docs/DEPLOY.md)
      COLLECTION_NAME: ${COLLECTION_NAME:-sop_documents}
      LLM_MODEL: openai/gpt-oss-120b
      ROUTER_MODEL: openai/gpt-oss-20b
      EMBED_MODEL: Xenova/multilingual-e5-base
      # Đổi chunk size phải index lại toàn bộ
      CHUNK_SIZE: "1200"
      CHUNK_OVERLAP: "150"
      TOP_K: "20"
      RERANK_TOP_K: "10"
      ENHANCED_RETRIEVAL: ${ENHANCED_RETRIEVAL:-false}
      # "SOP 0005" mà nhiều phòng ban trùng số → hiểu là của phòng ban này
      DEFAULT_CATEGORY: ${DEFAULT_CATEGORY:-QA}
      # Để trống = chưa bật auth cho /query* (giai đoạn app cũ chưa gửi token)
      API_TOKEN: ${API_TOKEN:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # QualZen (SQL Server): tra cứu Action Item, CCN, CAPA. Để trống QUALZEN_DB_SERVER = tắt.
      # Dùng tài khoản SQL chỉ có quyền đọc.
      QUALZEN_DB_SERVER: ${QUALZEN_DB_SERVER:-}
      QUALZEN_DB_PORT: ${QUALZEN_DB_PORT:-1433}
      QUALZEN_DB_NAME: ${QUALZEN_DB_NAME:-}
      QUALZEN_DB_USER: ${QUALZEN_DB_USER:-}
      QUALZEN_DB_PASSWORD: ${QUALZEN_DB_PASSWORD:-}
      QUALZEN_DB_ENCRYPT: ${QUALZEN_DB_ENCRYPT:-false}
      # Dữ liệu QualZen tối đa đưa vào prompt (ký tự). Danh sách dài hơn do server tự in.
      QUALZEN_PROMPT_BUDGET_CHARS: ${QUALZEN_PROMPT_BUDGET_CHARS:-12000}
      # Docuzen (quản lý tài liệu, cùng database QualZen): đếm / liệt kê / tra mã / phiên bản / ngày hiệu lực
      # theo danh mục chính thức (bản đang hiệu lực) thay cho đoán từ tên file. Cần QUALZEN_DB_*.
      DOCUZEN_ENABLED: ${DOCUZEN_ENABLED:-false}
      DOCUZEN_FILE_BASE_URL: ${DOCUZEN_FILE_BASE_URL:-http://10.1.11.35/fs/}
      # OCR cho PDF scan (xem backend/.env.example)
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_MIN_TEXT_CHARS: ${OCR_MIN_TEXT_CHARS:-200}
      OCR_IMAGE_TEXT_CHARS: ${OCR_IMAGE_TEXT_CHARS:-1500}
      CACHE_DIR: /app/.cache
      DATA_DIR: /app/data
      MANIFEST_DIR: /app/state
    volumes:
      # Model cache (ko muốn tải lại mỗi lần restart)
      - backend_cache:/app/.cache
      # Dữ liệu SOP đã sync từ SMB share về (xem scripts/sync-shared-folder.sh)
      - /opt/sop-local-data:/app/data:ro
      # Manifest của incremental ingest - phải nằm trên volume, nếu không mỗi lần
      # recreate container sẽ mất và file đã xóa không bao giờ bị gỡ khỏi Qdrant
      - backend_state:/app/state
    networks:
      - sop-net

networks:
  sop-net:
    driver: bridge

volumes:
  qdrant_storage:
    driver: local
  backend_cache:
    driver: local
  backend_state:
    driver: local
