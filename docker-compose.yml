# Dev compose: CHỈ Qdrant. Backend chạy local qua `npm run dev` để nhanh.
# Prod: dùng docker-compose.prod.yml

version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: sop-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__LOG_LEVEL: INFO

volumes:
  qdrant_storage:
    driver: local
